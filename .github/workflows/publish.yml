name: Publish

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true
      - run: corepack pnpm install
      - run: corepack pnpm test

  release:
    permissions:
      contents: write

    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true
      - run: corepack pnpm install
      - run: corepack pnpm build
      - run: corepack pnpm ovsx publish -p ${{ secrets.OVSX_TOKEN }}
      - run: corepack pnpm vsce publish -p ${{ secrets.VSCE_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
